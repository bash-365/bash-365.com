# =============================================================================
# _data/org/repos.yml — the BASH Consulting organization's repositories
# -----------------------------------------------------------------------------
# The org brain (scripts/brain/, docs/brain.md) reads this file to know which
# repositories make up the organization, how an agent should approach each one,
# and which upstream projects the organization builds on but does not own.
#
#   role: member    a repository in the bash-365 GitHub organization. The brain
#                   snapshots its agent-facing docs into brain/sources/, audits
#                   it against _data/org/standard.yml, and writes a repo card.
#   role: upstream  a project the org depends on and never forks. The brain
#                   writes a card that says where to change it; it is not
#                   audited here (the hub's conformance gate owns that).
#
# uses: the upstreams a member actually calls (reusable workflows and actions in
# its .github/workflows/, the theme in _config.yml). It draws the org map.
# There is no bamr87/.github entry: GitHub serves a .github repository's
# community-health defaults only to repositories of the same owner, so it
# reaches nothing in the bash-365 organization.
#
# hub_name is the entry's name in the hub registry (bamr87/bamr87
# _data/projects.yml), so the fleet tools (`tools/fanout.sh --target`,
# `tools/dash`) can be pointed at it. The hub registry stays the fleet-wide
# record; this file is the org's own view and says so where the two disagree.
#
# Format: the YAML subset scripts/loop/_lib.py reads (no block scalars, no
# anchors, no flow maps). Validate: python3 scripts/brain/brain.py repos --check
# =============================================================================

schema: org-repos/v1
org: bash-365
hub: bamr87/bamr87
brain_home: bash-365/bash-365.com

repos:
  - name: bash-365.com
    repo: bash-365/bash-365.com
    role: member
    branch: main
    status: active
    kind: site
    hub_name: bash-365.com
    live_url: "https://www.bash-365.com/"
    stack: [jekyll, ruby, python, typescript]
    summary: "BASH Consulting's website, its governed AI content pipeline, the Prompt Orchestrator VS Code extension, and the org brain every agent reads first."
    agent_file: AGENTS.md
    sources: [AGENTS.md, README.md, PRD.md, docs/constitution.md]
    uses: [bamr87, zer0-mistakes, zer0-CMS]

  - name: bash-365-apex
    repo: bash-365/bash-365-apex
    role: member
    branch: main
    status: maintenance
    kind: site
    hub_name: bash-365-apex
    live_url: "https://bash-365.com"
    stack: [html, github-pages]
    summary: "Client-side redirect from the bash-365.com apex domain to www, served by GitHub Pages because the Microsoft 365 DNS host has no ALIAS records."
    agent_file: AGENTS.md
    sources: [AGENTS.md, README.md, PRD.md, docs/constitution.md]
    uses: [bamr87]

  - name: csv-vscoode
    repo: bash-365/csv-vscoode
    role: member
    branch: main
    status: active
    kind: extension
    hub_name: csv-vscoode
    live_url: "https://apps.bash-365.com/csv-vscode/"
    stack: [typescript, vscode]
    summary: "CSV Grid Editor, a VS Code extension published as bash-365.csv-grid-viewer: a spreadsheet grid over delimited files with filters, SQL queries and re-runnable pipelines."
    agent_file: CLAUDE.md
    sources: [CLAUDE.md, README.md, docs/README.md]
    uses: [bamr87]
    # The hub registry still lists this repo as archived and unmaintained (six
    # commits). The checkout says otherwise: version 1.0.0 on the Marketplace,
    # docs at apps.bash-365.com, CI and release workflows, merges in 2026-11.
    # Fix the hub entry in bamr87/bamr87, not here.
    hub_drift: "hub registry status is archived; the repository is active"

  - name: bamr87
    repo: bamr87/bamr87
    role: upstream
    branch: main
    status: active
    kind: hub
    hub_name: bamr87
    live_url: "https://bamr87.github.io/bamr87/"
    stack: [python, bash, github-actions]
    summary: "The fleet hub: the Universal Project Standard (specs/), the kits fanned out to every repo, the reusable CI and AI workflows, the fleet registry and the control plane."
    agent_file: AGENTS.md
    change_here: "Standards, kits, reusable workflows and the fleet registry. Org repos consume them by reference and never copy their logic."

  - name: zer0-mistakes
    repo: bamr87/zer0-mistakes
    role: upstream
    branch: main
    status: active
    kind: theme
    hub_name: zer0-mistakes
    live_url: "https://zer0-mistakes.com/"
    stack: [jekyll, ruby, scss]
    summary: "The Jekyll theme bash-365.com renders with (remote_theme). Every deliberate fork is declared in this repo's .theme-overrides.yml."
    agent_file: CLAUDE.md
    change_here: "Layouts, includes, styles and theme bugs. Override locally only through .theme-overrides.yml."

  - name: zer0-CMS
    repo: bamr87/zer0-CMS
    role: upstream
    branch: main
    status: active
    kind: platform
    hub_name: zer0-CMS
    live_url: null
    stack: [python, django, react, typescript]
    summary: "The content platform that reads this repo's zer0.json contract and runs the LinkedIn and X distribution lanes the site's publish workflows call."
    agent_file: AGENTS.md
    change_here: "The zer0.json contract, the distribution lanes and the doctor check."

  - name: README
    repo: bamr87/README
    role: upstream
    branch: main
    status: active
    kind: knowledge
    hub_name: README
    live_url: "https://bamr87.github.io/README/"
    stack: [python, mkdocs]
    summary: "The fleet-wide second brain: every fleet repository's documentation collected into one vault, served over its own read-only MCP server. The org brain covers BASH; this one covers the whole fleet."
    agent_file: AGENTS.md
    change_here: "Cross-fleet documentation questions. Query its MCP server (readme-context-engine) from a checkout of that repository."
