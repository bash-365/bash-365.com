# zer0 doctor — the zer0 stack consumer contract check
#
# A thin caller of zer0-CMS's reusable doctor: is this site still aligned with
# the zer0 stack — the zer0-mistakes theme and .theme-overrides.yml, the
# zer0-image-generator gem and its one `preview_images:` block, a valid
# zer0.json, a strict fleet.manifest.yml, and front matter the theme's schema
# accepts? Warnings only report; an error fails the run (fail-on-error: true).
#
# It was report-only until 2026-10-29, and that hid an unparseable zer0.json
# for seven weekly runs: every run listed `zer0-json-invalid` in its findings
# and finished green, while the LinkedIn lane, reading defaults instead of the
# file, would have answered a merged draft with "Nothing to publish". So it now
# also runs on a pull request that touches a file it validates, and fails
# there before the file reaches main. Content PRs do not trigger it;
# build-validate.yml stays the gate for the build and the editorial lint.
#
# Makes no model call and reads no secret, so it needs no *_ENABLED switch and
# no fleet.manifest.yml lane (like build-validate.yml and site-health.yml).
#
# No timeout-minutes on the job: GitHub rejects that key on a job that calls a
# reusable workflow; the called workflow's own jobs carry the timeout.
#
# Locally, from a zer0-CMS checkout (PyYAML and jsonschema; its content/.venv has both):
#   cd content && .venv/bin/python -m sites.doctor /path/to/bash-365.com

name: zer0 doctor

on:
  schedule:
    - cron: '29 6 * * 3' # weekly, Wednesday 06:29 UTC
  pull_request:
    paths:
      - 'zer0.json'
      - 'fleet.manifest.yml'
      - '.theme-overrides.yml'
      - '_config.yml'
  workflow_dispatch:

permissions:
  contents: read

# Per ref, so a pull request's run never cancels the weekly one.
concurrency:
  group: zer0-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    uses: bamr87/zer0-CMS/.github/workflows/zer0-doctor.yml@main
    with:
      fail-on-error: true
