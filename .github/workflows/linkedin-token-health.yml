# Weekly LinkedIn token health check, through zer0-CMS's distribution lane.
#
# LinkedIn access tokens last 60 days, so the realistic failure is a token that
# died quietly and a merged draft that then fails to publish. This asks LinkedIn
# about the token — with LINKEDIN_CLIENT_ID and LINKEDIN_CLIENT_SECRET set it
# reads the real expiry by introspection; without them it proves the token works
# with a cheap read — and fails the run when the token is rejected or within 7
# days of expiry. Issues are disabled on this repository, so the failed run and
# its job summary are the alert. Skips with a notice when no token is set.
#
# A skip is green, so a green run proves nothing until LINKEDIN_ACCESS_TOKEN
# exists: read the run's notice before trusting it.
#
# Renew: `scripts/linkedin.sh connect --print-token` as a page admin, or
# LinkedIn's token generator, then update the secret.

name: LinkedIn token health

on:
  schedule:
    - cron: '41 13 * * 1' # Mondays 13:41 UTC (~6–7 AM Denver)
  workflow_dispatch:

# The reusable workflow declares no permissions, so this grant is the job's:
# `status` reads and writes nothing.
permissions:
  contents: read

concurrency:
  group: linkedin-token-health
  cancel-in-progress: false

jobs:
  check:
    uses: bamr87/zer0-CMS/.github/workflows/zer0-linkedin.yml@main
    with:
      command: status
      warn-days: 7
    # By name, not `secrets: inherit`: GitHub passes inherited secrets only to a
    # reusable workflow in the same organization or enterprise, and this one
    # lives in the bamr87 account, so `inherit` passed nothing.
    secrets:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
