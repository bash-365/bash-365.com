<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t"><title id="t">A twelve-to-eighteen-month technology roadmap sequenced in four phases: assess, secure, modernize, automate</title>
<defs>
<radialGradient id="bg" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#1f3d5b"/><stop offset="1" stop-color="#0b1622"/></radialGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6fb4d6" fill-opacity=".14"/></pattern>
<linearGradient id="pn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#284a6b"/><stop offset="1" stop-color="#172b40"/></linearGradient>
<linearGradient id="pn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36658f"/><stop offset="1" stop-color="#1f3d5b"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.pn{fill:url(#pn);stroke:#3f7aa0;stroke-width:1.5}.pn2{fill:url(#pn2);stroke:#6fb4d6;stroke-width:1.5}
.ln{fill:none;stroke:#6fb4d6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.wire{fill:none;stroke:#376986;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lb{fill:#e6eff6;font:600 17px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif}.lbs{fill:#9cc0d6;font:500 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif}
.t{fill:#6fb4d6}.tl{fill:#a9d8ef}.td{fill:#376986}.dk{fill:#14263a}.w{fill:#e6eff6}.r{fill:#e04848}
.rs{fill:none;stroke:#e04848;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.pk{fill:#cdeaf8}.pkr{fill:#ff6b6b}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk,.pkr{display:none}}
</style>
<rect width="640" height="240" fill="url(#bg)"/><rect width="640" height="240" fill="url(#dots)"/>

<g filter="url(#sh)"><polygon points="95,98 203,98 217,120 203,142 95,142 95,120" fill="#2a5274" stroke="#6fb4d6" stroke-opacity=".5"/><text class="lb" x="152" y="126" text-anchor="middle" style="font-size:15px">Assess</text><circle cx="149" cy="68" r="9" class="ln"/><path class="ln" d="M156 75l7 7"/><polygon points="203,98 311,98 325,120 311,142 203,142 217,120" fill="#33658e" stroke="#6fb4d6" stroke-opacity=".5"/><text class="lb" x="267" y="126" text-anchor="middle" style="font-size:15px">Secure</text><path class="ln" d="M267 56l13 5v9c0 8-6 13-13 16-7-3-13-8-13-16v-9z"/><polygon points="311,98 419,98 433,120 419,142 311,142 325,120" fill="#3f7aa8" stroke="#6fb4d6" stroke-opacity=".5"/><text class="lb" x="375" y="126" text-anchor="middle" style="font-size:15px">Modernize</text><path class="ln" d="M361 64l14-7 14 7-14 7z"/><path class="ln" d="M361 72l14 7 14-7M361 80l14 7 14-7"/><polygon points="419,98 527,98 541,120 527,142 419,142 433,120" fill="#4f8fbf" stroke="#6fb4d6" stroke-opacity=".5"/><text class="lb" x="483" y="126" text-anchor="middle" style="font-size:15px">Automate</text><circle cx="483" cy="71" r="11" fill="none" stroke="#6fb4d6" stroke-width="6.1" stroke-dasharray="4.6 3.3"/><circle cx="483" cy="71" r="6.8" class="t"/><circle cx="483" cy="71" r="2.8" class="dk"/></g>
<path d="M95 158H541" stroke="#3f7aa0" stroke-width="1.5"/><path d="M95 154v8" stroke="#6fb4d6" stroke-width="2"/><text class="lbs" x="95" y="182" text-anchor="start">Month 0</text><path d="M244 154v8" stroke="#6fb4d6" stroke-width="2"/><text class="lbs" x="244" y="182" text-anchor="middle">6</text><path d="M392 154v8" stroke="#6fb4d6" stroke-width="2"/><text class="lbs" x="392" y="182" text-anchor="middle">12</text><path d="M541 154v8" stroke="#6fb4d6" stroke-width="2"/><text class="lbs" x="541" y="182" text-anchor="end">18</text>
<path class="r" d="M95 146l6 8h-12z"/>
</svg>
