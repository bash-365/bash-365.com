# Weekly content gardener.
#
# Every Monday, Claude drafts ONE new blog post into drafts/ — following the
# repo's editorial instructions — and opens a pull request for human review.
# It never pushes to main.
#
# The topic is resolved deterministically before the agent starts: the dispatch
# input when a person typed one; else the first open, unclaimed `write`
# directive the hub's content atlas filed here as an `editorial:directive` issue
# (scripts/loop/directives.py — no gh, no token or an API refusal just means
# none); else the gardener's own gap pick. A directive-driven pull request
# carries `Closes #<n>` and the run comments the PR link on the issue, so a
# merge closes the directive and the hub reads it back. docs/content-loop.md,
# "Where the ideas come from".
#
# OFF by default on the schedule: the weekly run idles until the repo VARIABLE
# CONTENT_GARDENER_ENABLED is "true" — the kill switch. The bot token cannot set
# variables, so the gardener can never enable itself. A manual run
# (workflow_dispatch) works without the variable — a human pressed the button.
#   gh variable set CONTENT_GARDENER_ENABLED --body true
#
# Auth (Settings → Secrets and variables → Actions), OAuth preferred:
#   1. CLAUDE_CODE_OAUTH_TOKEN — Claude Code OAuth token from `claude setup-token`
#      (Claude Pro/Max). Used by default when set.
#   2. ANTHROPIC_API_KEY — workspace API key. Fallback, used when no OAuth token.
# When neither is set the workflow skips gracefully with a notice instead of
# failing. If both are set, only the OAuth token reaches claude-code-action —
# the API-key input is blanked by expression, so the key is never billed while
# the subscription token exists.
#
# Optional: add a GARDENER_GITHUB_TOKEN secret (fine-grained PAT with
# Contents + Pull requests read/write on this repo). PRs opened with the
# default GITHUB_TOKEN cannot trigger other workflows, so the Azure Static
# Web Apps staging build only runs on the gardener's PRs when this PAT is
# set (or after any human push to the PR branch).

name: Content gardener

on:
  schedule:
    - cron: '23 14 * * 1' # Mondays 14:23 UTC (~7–8 AM Denver)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic override (one sentence). Leave blank to take the first open editorial:directive issue of kind write, else let the gardener pick an uncovered topic.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write # the directive issue gets a comment linking the pull request
  id-token: write

concurrency:
  group: content-gardener
  cancel-in-progress: false

jobs:
  draft-post:
    name: Draft one post and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the kill switch and an Anthropic credential
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLED: ${{ vars.CONTENT_GARDENER_ENABLED }}
          CONTENT_LOOP_ENABLED: ${{ vars.CONTENT_LOOP_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          # When the content loop is on, its daily cadence covers this schedule —
          # stand down so topics aren't doubled. A manual run still works.
          if [ "$EVENT" = "schedule" ] && [ "$CONTENT_LOOP_ENABLED" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The content loop is enabled (CONTENT_LOOP_ENABLED=true) and covers this schedule — the weekly gardener idles. Run it manually (workflow_dispatch) for an extra piece. See docs/content-loop.md."
          # The kill switch: a scheduled run needs CONTENT_GARDENER_ENABLED=true;
          # a manual run (workflow_dispatch) proceeds whenever a credential exists.
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$ENABLED" = "true" ]; then
            if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No Anthropic credential set — skipping the weekly draft. Add CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY under Settings → Secrets and variables → Actions to activate the content gardener."
            fi
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The content gardener is off (repo variable CONTENT_GARDENER_ENABLED != true) — the weekly schedule idles. Turn it on with: gh variable set CONTENT_GARDENER_ENABLED --body true. A manual run (workflow_dispatch) works without it."
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deterministic: the topic, the directive (if any) and the branch name are
      # decided here, before any model runs. The agent only reads the outputs.
      - name: Resolve the topic (input → open write directive → the gardener's own pick)
        if: steps.gate.outputs.ready == 'true'
        id: topic
        env:
          GH_TOKEN: ${{ secrets.GARDENER_GITHUB_TOKEN || github.token }}
          TOPIC_INPUT: ${{ inputs.topic }}
        run: |
          today="$(date -u +%Y-%m-%d)"
          topic="$TOPIC_INPUT"; number=""; url=""; source=input
          if [ -z "$topic" ]; then
            # The hub's content atlas files approved topics here as editorial:directive
            # issues. The reader tolerates no gh / no token (an empty list and a note).
            found="$(python3 scripts/loop/directives.py --kind write --max 1 --json 2>/dev/null || echo '{"directives":[],"notes":["directives.py failed"]}')"
            number="$(printf '%s' "$found" | jq -r '.directives[0].number // ""')"
            if [ -n "$number" ]; then
              url="$(printf '%s' "$found" | jq -r '.directives[0].url')"
              topic="$(printf '%s' "$found" | jq -r '.directives[0].title')"
              mkdir -p .loop
              printf '%s' "$found" | jq '.directives[0]' > .loop/directive.json
              source=directive
              echo "topic from editorial directive #$number: $topic ($url)"
            else
              source=gap
              echo "::notice::No open, unclaimed write directive (label editorial:directive) — the gardener picks an uncovered topic itself. $(printf '%s' "$found" | jq -r '.notes | join("; ")')"
            fi
          else
            echo "topic from the dispatch input"
          fi
          slug=""; branch=""
          if [ -n "$topic" ]; then
            # The house slug rule (scripts/loop/_lib.py), so two topics on one day never share a branch.
            slug="$(python3 -c 'import sys; sys.path.insert(0, "scripts/loop"); import _lib; print(_lib.slugify(sys.argv[1]))' "$topic")"
            branch="content/weekly-draft-$today-$slug"
          fi
          {
            echo "source=$source"
            echo "today=$today"
            echo "slug=$slug"
            echo "branch=$branch"
            echo "directive_number=$number"
            echo "directive_url=$url"
            echo "topic<<GARDENER_TOPIC_EOF"
            echo "$topic"
            echo "GARDENER_TOPIC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Draft post and open PR
        if: steps.gate.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token preferred. The action does NOT reliably prefer OAuth when
          # both inputs are given, so the API key is passed ONLY when no OAuth
          # token exists — this expression, not the action, enforces the order.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GARDENER_GITHUB_TOKEN || github.token }}
          prompt: |
            You are the weekly content gardener for bash-365.com, a
            Denver-metro IT consultancy for small and medium businesses.
            Draft exactly ONE new blog post and open a pull request. Never
            commit or push to main.

            Step 1 — read the editorial authority first:
            - .github/instructions/content-style.instructions.md (voice, audience, banned phrases, universal checklist)
            - .github/instructions/posts.instructions.md (frontmatter, filename, structure)
            - .github/prompts/article-write.prompt.md (the drafting workflow to follow)

            Step 2 — the topic (resolved before you started; source: ${{ steps.topic.outputs.source }}):
            - TOPIC: "${{ steps.topic.outputs.topic }}"
            - DIRECTIVE_NUMBER: "${{ steps.topic.outputs.directive_number }}"
            - DIRECTIVE_URL: "${{ steps.topic.outputs.directive_url }}"
            - If TOPIC is non-blank, write about it. When DIRECTIVE_NUMBER is
              non-blank the topic is an editorial directive the hub filed:
              read `.loop/directive.json` (its brief, priority, pillar, the
              narrative it serves) and serve the brief — it says what to
              write about, never what to claim; evidence still comes from
              the practice's work, the site's pages, or a primary source.
            - Only when TOPIC is blank: list existing posts
              (pages/_posts/**/*.md — read their titles, descriptions,
              categories, and tags) and read _data/taxonomy.yml if it exists
              (fall back to _data/entity/services.yml for the service
              catalog). Choose one topic a Denver SMB owner/operator would
              search for that no existing post covers yet, tied to a service
              the site offers.

            Step 3 — write the draft:
            - Get today's date with: date -u +%Y-%m-%d
            - Create ONE file: drafts/YYYY-MM-DD-<kebab-slug>.md
            - Follow the article-write prompt's frontmatter and body skeleton
              exactly, with two deviations because this file awaits human
              review in drafts/: set `draft: true`, and add an HTML comment at
              the top of the body noting the intended pages/_posts subfolder
              (corp/erp/muses/tech per the routing table).
            - Use today's date for both `date:` and `lastmod:` in ISO-8601
              with milliseconds (T12:00:00.000Z).
            - Run the voice gate self-check from the article-write prompt
              before finishing. Do not invent metrics, client names, or
              certifications. Do not create any other files and do not
              generate images.

            Step 4 — open the pull request:
            - git config user.name "github-actions[bot]" and
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            - Create the branch "${{ steps.topic.outputs.branch }}"; when that
              is blank (you picked the topic), name it
              content/weekly-draft-YYYY-MM-DD-<slug> with the slug from your
              topic by the house rule (lowercase, non-alphanumeric runs to
              `-`, edges stripped, 50 chars). Commit the single new file with
              message "content(posts): weekly draft — <topic>" and push the
              branch.
            - Open a PR against main with `gh pr create`, titled exactly:
              content(posts): weekly draft — <topic>
              When DIRECTIVE_NUMBER is non-blank, the FIRST line of the PR
              body is exactly `Closes #<DIRECTIVE_NUMBER>` and the body links
              DIRECTIVE_URL as the brief it serves; never write `Closes`
              otherwise. The body must state the chosen topic and why it
              fills a gap (or which directive it serves), plus a promotion
              checklist for the reviewer: move the file to
              pages/_posts/<subfolder>/, flip `draft:` to false, confirm the
              preview image at the frontmatter's `preview:` path exists (or
              regenerate it), and update `lastmod` if edited.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(date:*),Bash(ls:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*)"

      # Deterministic, after the agent: tell the directive issue where its draft
      # is. The branch name was fixed above, so the pull request is found by it.
      - name: Comment the pull request link on the directive issue
        if: steps.gate.outputs.ready == 'true' && steps.topic.outputs.directive_number != ''
        env:
          GH_TOKEN: ${{ secrets.GARDENER_GITHUB_TOKEN || github.token }}
          NUMBER: ${{ steps.topic.outputs.directive_number }}
          BRANCH: ${{ steps.topic.outputs.branch }}
        run: |
          pr="$(gh pr list --state open --head "$BRANCH" --limit 1 --json url --jq '.[0].url // ""' 2>/dev/null || true)"
          if [ -z "$pr" ]; then
            echo "::warning::No open pull request on $BRANCH — nothing to link on #$NUMBER (did the draft step open one?)."
            exit 0
          fi
          gh issue comment "$NUMBER" --body "The weekly content gardener drafted this directive: $pr — a merge closes this issue."
          echo "linked $pr on #$NUMBER"
