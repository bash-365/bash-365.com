<text class="lbs" x="380" y="144">After</text><text class="lbs" x="536" y="144" text-anchor="end">3–5 days</text><rect x="380" y="152" width="12" height="22" rx="2" class="tl"/><rect x="396" y="152" width="12" height="22" rx="2" class="tl"/><rect x="412" y="152" width="12" height="22" rx="2" class="tl"/><rect x="428" y="152" width="12" height="22" rx="2" class="t" opacity=".55"/><rect x="444" y="152" width="12" height="22" rx="2" class="t" opacity=".55"/><rect x="460" y="152" width="12" height="22" rx="2" fill="none" stroke="#3f7aa0" stroke-width="1.5"/><rect x="476" y="152" width="12" height="22" rx="2" fill="none" stroke="#3f7aa0" stroke-width="1.5"/><rect x="492" y="152" width="12" height="22" rx="2" fill="none" stroke="#3f7aa0" stroke-width="1.5"/><rect x="508" y="152" width="12" height="22" rx="2" fill="none" stroke="#3f7aa0" stroke-width="1.5"/><rect x="524" y="152" width="12" height="22" rx="2" fill="none" stroke="#3f7aa0" stroke-width="1.5"/>
</svg>
