<text class="lb" x="114" y="62" style="font-size:15px">Dr</text><text class="lb" x="228" y="62" style="font-size:15px">Cr</text>
<rect class="w" opacity=".85" x="114" y="82" width="54" height="9" rx="3"/><rect class="w" opacity=".85" x="228" y="82" width="54" height="9" rx="3"/><path d="M174 86.5H222" stroke="#6fb4d6" stroke-width="2" stroke-dasharray="2 4"/><path class="ln" d="M306 86l5 5 10 -11"/><rect class="w" opacity=".85" x="114" y="108" width="40" height="9" rx="3"/><rect class="w" opacity=".85" x="228" y="108" width="40" height="9" rx="3"/><path d="M160 112.5H222" stroke="#6fb4d6" stroke-width="2" stroke-dasharray="2 4"/><path class="ln" d="M306 112l5 5 10 -11"/><rect class="w" opacity=".85" x="114" y="134" width="62" height="9" rx="3"/><rect class="w" opacity=".85" x="228" y="134" width="62" height="9" rx="3"/><path d="M182 138.5H222" stroke="#6fb4d6" stroke-width="2" stroke-dasharray="2 4"/><path class="ln" d="M306 138l5 5 10 -11"/>
<rect x="104" y="160" width="232" height="28" rx="6" fill="#e04848" fill-opacity=".16" stroke="#e04848" stroke-width="1.5"/>
<rect class="w" opacity=".85" x="114" y="170" width="48" height="9" rx="3"/><rect class="w" opacity=".85" x="228" y="170" width="34" height="9" rx="3"/>
<path class="rs" d="M168 174.5h18M204 174.5h18"/><path class="rs" d="M190 168l10 13"/><path class="rs" d="M308 168l12 12M320 168l-12 12"/>
<text class="lb" x="380" y="64">Month-end close</text>
