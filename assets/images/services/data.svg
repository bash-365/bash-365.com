<path d="M350 52a10 10 0 0 1 10-10h175a10 10 0 0 1 10 10v12H350z" class="dk"/>
<path class="ln rf" d="M531 49a6 6 0 1 1-6-1" stroke-width="2"/><path d="M523 45l3 3-3 3" class="ln" stroke-width="2"/>
