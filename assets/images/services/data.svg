<circle class="pk" r="4" filter="url(#gl)"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite" path="M152 70C196 70 200 112 236 116"/></circle><circle class="pk" r="4" filter="url(#gl)"><animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M152 122H236"/></circle><circle class="pk" r="4" filter="url(#gl)"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M152 172C196 172 200 130 236 128"/></circle><circle class="pk" r="4" filter="url(#gl)"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite" path="M304 122H350"/></circle>
</svg>
