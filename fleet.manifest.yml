# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: amr-bash/bash-365.com
provenance: derived
summary: Four Claude lanes on a Jekyll consultancy site — the daily content loop and the weekly gardener, review, and preacher, each OFF on schedule until its own *_ENABLED repo variable is true — plus the @claude mention handler.
lanes:
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: content-gardener
  kind: content
  harness: claude-code-action
  implementation: .github/workflows/content-gardener.yml
  description: Content gardener — one weekly draft; the topic is the dispatch input, else the hub's first open editorial:directive issue of kind write (scripts/loop/directives.py), else a gap pick
  triggers:
  - kind: schedule
    cron: 23 14 * * 1
  - kind: dispatch
  switch: CONTENT_GARDENER_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - GARDENER_GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: content-loop
  kind: content
  harness: claude-code-action
  implementation: .github/workflows/content-loop.yml
  description: Content loop — daily, from the practice's own work; an unclaimed write editorial:directive issue goes ahead of a new article
  triggers:
  - kind: schedule
    cron: 11 14 * * *
  - kind: dispatch
  switch: CONTENT_LOOP_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - CONTENT_LOOP_GITHUB_TOKEN
  - OPENAI_API_KEY
  guardrails:
    never_merges: true
- id: content-review
  kind: review
  harness: claude-code-action
  implementation: .github/workflows/content-review.yml
  description: Content review (weekly) — the focus is the dispatch input, else the document of the hub's first open refresh or fix editorial:directive issue
  triggers:
  - kind: schedule
    cron: 37 14 * * 4
  - kind: dispatch
  switch: CONTENT_REVIEW_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - CONTENT_REVIEW_GITHUB_TOKEN
  guardrails:
    never_merges: true
- id: preacher
  kind: other
  harness: claude-code-action
  implementation: .github/workflows/preacher.yml
  description: Preacher (weekly doctrine)
  triggers:
  - kind: schedule
    cron: 42 14 * * 6
  - kind: dispatch
  switch: PREACHER_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - PREACHER_GITHUB_TOKEN
  guardrails:
    never_merges: true
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - claude
  - content-gardener
  - content-loop
  - content-review
  - preacher
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by 
`claude setup-token`.'
  used_by:
  - claude
  - content-gardener
  - content-loop
  - content-review
  - preacher
- name: CONTENT_LOOP_GITHUB_TOKEN
  scope: repo
  required: true
  used_by:
  - content-loop
- name: CONTENT_REVIEW_GITHUB_TOKEN
  scope: repo
  required: true
  used_by:
  - content-review
- name: GARDENER_GITHUB_TOKEN
  scope: repo
  required: true
  used_by:
  - content-gardener
- name: OPENAI_API_KEY
  scope: repo
  required: true
  used_by:
  - content-loop
- name: PREACHER_GITHUB_TOKEN
  scope: repo
  required: true
  used_by:
  - preacher
agents:
- article-reviewer-editor
- brand-guardian
- content-curator
- jekyll-build-validator
- loop-writer
- preacher
skills:
- brand
- content-editorial
- content-loop
- linkedin-share
- toolkit-doc
- wikilinks

