# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.

exclude:
  # ── Repo docs that are not site pages ────────────────────────────────────
  # These were REACHABLE IN PRODUCTION: bash-365.com/{CLAUDE,AGENTS,CHANGELOG,
  # README}.md all returned 200, serving this repo's internal AI-agent
  # instructions, changelog, and developer readme from the marketing domain.
  # They have no front matter, so github-pages' jekyll-optional-front-matter
  # also rendered /CLAUDE/, /AGENTS/ and /CHANGELOG/ pages from them. Every
  # other zer0-mistakes consumer in the fleet excludes these; this site was
  # the outlier. They are read on GitHub, never published here.
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - CHANGELOG.md
  # Dev/tooling config that has no business in _site/ either.
  - Dockerfile
  - docker-compose.yml
  - package.json
  - frontmatter.json
  - zer0.json            # zer0-CMS project config (was served at /zer0.json)
  # NOTE: staticwebapp.config.json (Azure reads it from the deployed root),
  # favicon.ico, LICENSE and llms.txt stay published on purpose — do not add
  # them here.
  - .sass-cache/
  - .jekyll-cache/
  - .obsidian
  # Transient browser-automation output; excluded so `jekyll serve --watch`
  # never rebuilds in a loop when these files appear or change.
  - .playwright-mcp/
  - Gemfile.lock
  - gemfiles/
  - Gemfile
  - node_modules/
  # Repo tooling and source that must never ship as site pages/static files:
  - scripts/
  - api/
  - drafts/
  - extension/
  - infra/
  # Agent and repository guidance is source-only and contains links that are
  # meaningful in the repository but cannot resolve on the public site.
  - AGENTS.md
  - CLAUDE.md
  - .github/
  - .claude/
  # Exclude Bundler's vendor dir (Ruby gems). assets/vendor/ is a different path
  # and is intentionally committed for GitHub Pages (Bootstrap, jQuery, etc.).
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # - "*.sh"
  - submodules/
  - docs/
  - templates/
  - MERMAID-*.md
  - MERMAID-*/
  - test/
  - _site/lib/

# Sass/SCSS
sass:
  sass_dir: _sass
  style: expanded

#  TODO: Fix bootstrap plugin
  # load_paths:
